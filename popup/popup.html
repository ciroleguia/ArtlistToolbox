<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Artlist Downloader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <img src="../icons/icon48.png" alt="" class="logo">
        <div>
          <h1>Artlist Downloader</h1>
          <p>Quick access and download flow helper.</p>
        </div>
      </header>

      <div class="settings-row">
        <span>Enable Downloader</span>
        <label class="switch">
          <input type="checkbox" id="toggle-extension" checked>
          <span class="slider"></span>
        </label>
      </div>

      <section class="settings-block">
        <div class="settings-head">
          <span>Download flow</span>
        </div>
        <div class="mode-group" id="flow-modes" role="radiogroup" aria-label="Download flow">
          <button type="button" class="mode-option" data-mode="auto" role="radio">Auto</button>
          <button type="button" class="mode-option" data-mode="ask" role="radio">Ask me</button>
          <button type="button" class="mode-option" data-mode="search" role="radio">Search only</button>
        </div>
        <small id="flow-hint" class="settings-hint"></small>
      </section>

      <section class="settings-block">
        <div class="settings-head">
          <span>Match threshold</span>
          <small id="threshold-value">42%</small>
        </div>
        <input type="range" id="min-score" min="30" max="75" step="5" value="42" aria-label="Match threshold">
      </section>

      <div class="settings-row">
        <div class="settings-label">
          <span>Open in background</span>
          <small>Don't focus the tab we open.</small>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-background">
          <span class="slider"></span>
        </label>
      </div>

      <div class="settings-row">
        <div class="settings-label">
          <span>Hide promo banner</span>
          <small>Removes the big promo hero on library pages.</small>
        </div>
        <label class="switch">
          <input type="checkbox" id="toggle-hide-hero">
          <span class="slider"></span>
        </label>
      </div>

      <button id="open-artlist" class="primary-button" type="button">
        Open Artlist Music
      </button>

      <section class="recent">
        <div class="recent-head">
          <span>Recent downloads</span>
          <button id="clear-recent" type="button">Clear</button>
        </div>
        <ul id="recent-list"></ul>
        <p id="recent-empty">No downloads yet.</p>
      </section>

      <footer class="credits">
        developed by <a href="https://github.com/ciroleguia" target="_blank" rel="noopener">Ciro</a>
        <span id="version" class="version"></span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
