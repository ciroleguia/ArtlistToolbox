<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Artlist Downloader</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <img src="../icons/icon48.png" alt="" class="logo">
        <div>
          <h1>Artlist Downloader</h1>
          <p>Quick access and download flow helper.</p>
        </div>
      </header>

      <div class="settings-row">
        <span>Enable Downloader</span>
        <label class="switch">
          <input type="checkbox" id="toggle-extension" checked>
          <span class="slider"></span>
        </label>
      </div>

      <button id="open-artlist" class="primary-button" type="button">
        Open Artlist Music
      </button>

      <footer class="credits">
        Extension by <strong>Ciro Leguía</strong>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
